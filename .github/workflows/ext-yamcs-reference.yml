# Builds and runs integration tests on https://github.com/yvijay99/fprime-yamcs-reference

name: "External Repo: YAMCS Reference"

on:
  schedule:
    - cron: "0 21 * * *"  # Nightly at 2:00 PM US/Pacific (PDT)
  push:
    branches: [release/**]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [devel, release/**]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
  workflow_dispatch:

# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') && !contains(github.ref, 'YAMCSCI') }}

permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: fprime-community/fprime-yamcs-reference
      # F Prime 4.3 compatibility baseline; newer main needs post-4.3 APIs.
      default_target_ref: db9acfd548a0950aa50c06760cc9d338214f8986

  build:
    needs: get-branch
    name: ""
    uses: ./.github/workflows/reusable-project-builder.yml
    with:
      target_repository: fprime-community/fprime-yamcs-reference
      build_location: FprimeYamcsReference/YamcsDeployment
      run_unit_tests: false
      target_ref: ${{ needs.get-branch.outputs.target-branch }}
      fprime_location: ./lib/fprime

  test:
    name: "Test"
    runs-on: ubuntu-22.04
    needs: [get-branch, build]
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime-yamcs-reference
          target_ref: ${{ needs.get-branch.outputs.target-branch }}

      - name: "Download build artifacts"
        uses: actions/download-artifact@v7
        with:
          name: examples-build-artifacts
          path: .

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "yamcs-client<2.0.0"
          pip install "fprime-gds==4.2.2a4"
          pip install "fprime-xtce>=0.1.3"
          pip install "fprime-yamcs>=0.1.4"

      - name: "Use Maven 3.10-compatible YAMCS launcher"
        # fprime-yamcs 0.1.5 bundles plugin 1.3.5, which loses the dependency
        # repositories with Maven 3.10. Upstream fixed this in plugin 1.3.11.
        # https://github.com/yamcs/yamcs-maven-plugin/releases/tag/v1.3.11
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          import xml.etree.ElementTree as ET

          pom = distribution("fprime-yamcs").locate_file("fprime_yamcs/yamcs/pom.xml")
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          tree = ET.parse(pom)
          version = tree.find(
              "./m:build/m:plugins/m:plugin[m:artifactId='yamcs-maven-plugin']/m:version",
              namespace,
          )
          if version is None:
              raise RuntimeError("YAMCS launcher plugin is missing from the packaged POM")
          version.text = "1.3.11"
          ET.register_namespace("", namespace["m"])
          with pom.open("wb") as output:
              tree.write(output, encoding="utf-8", xml_declaration=True)
          PY

      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true

      - name: "Prepare deployment"
        run: chmod +x ./build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}

      - name: "Run integration tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          ground-system: fprime-yamcs
          gds-working-directory: "."
          test-working-directory: "."
          binary: ./build-artifacts/Linux/FprimeYamcsReference_YamcsDeployment/bin/FprimeYamcsReference_YamcsDeployment
          # Absolute path needed because YAMCS passes this down to a subprocess
          gds-args: -d ${{ github.workspace }}/build-artifacts/Linux/FprimeYamcsReference_YamcsDeployment
          ready-check: python -c "from yamcs.client import YamcsClient; list(YamcsClient('127.0.0.1:8090').list_instances())"
          ready-timeout: "300"
          timeout: "1800"
          pytest-args: >-
            --dictionary ./build-artifacts/Linux/FprimeYamcsReference_YamcsDeployment/dict/YamcsDeploymentTopologyDictionary.json
            --deployment-config ./FprimeYamcsReference/YamcsDeployment/test/int/int_config.json
            --use-yamcs
            -v
            ./FprimeYamcsReference/YamcsDeployment/test/int/test_yamcs_file_transfer.py
            ./lib/fprime/Svc/PrmDb/test/int/test_cmd_PrmDb.py
            ./lib/fprime/Svc/CmdDispatcher/test/int/test_cmd_dispatcher.py
            ./lib/fprime/Svc/DpCatalog/test/int/test_cmd_dpCatalog.py
            ./lib/fprime/Svc/DpManager/test/int/test_cmd_dpMgr.py
            ./lib/fprime/Svc/DpWriter/test/int/test_cmd_dpWriter.py
            ./lib/fprime/Svc/EventManager/test/int/test_cmd_eventManager.py
            ./lib/fprime/Svc/FileDownlink/test/int/test_cmd_fileDownlink.py
            ./lib/fprime/Svc/FileManager/test/int/test_cmd_fileManager.py
            ./lib/fprime/Svc/SystemResources/test/int/test_cmd_systemResources.py
            ./lib/fprime/Svc/CmdSequencer/test/int/test_cmd_sequencer.py
            ./lib/fprime/Svc/FileUplink/test/int/test_cmd_uplink.py
            ./lib/fprime/Svc/Subtopologies/CdhCore/test/int/test_cdh_core.py
            ./lib/fprime/Svc/Subtopologies/FileHandling/test/int/test_file_handling.py
            ./lib/fprime/Svc/Version/test/int/test_cmd_version.py
            ./lib/fprime/Svc/Health/test/int/test_cmd_health.py

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: gds-logs
          retention-days: 5
