name: Rust

on:
  push:
    branches: [fprime-rs, master, devel]
    paths:
      - "Rust/**"
      - "tools/fprime-rs/**"
      # Phases 8 and 9: an upstream edit to a file a generated shim mirrors
      # must re-run its --check, or the Rust-backed copy diverges silently
      - "Fw/Types/**"
      - "Fw/Time/**"
      - "Os/FilePathUtils*"
      - "Os/SandboxedFile.cpp"
      - "Os/Generic/**"
      - "Os/CMakeLists.txt"
      - "cmake/FPrime.cmake"
      - "TestDeploymentsProject/Ref/Top/**"
      - "Utils/Types/**"
      - "Utils/Hash/**"
      - "CFDP/Checksum/**"
      - "Svc/FprimeDeframer/**"
      - "Svc/FprimeFramer/**"
      - "Svc/FprimeProtocol/**"
      - "Svc/FrameAccumulator/**"
      - "Svc/ComQueue/**"
      - "Svc/RustDemo/**"
      - "Svc/FprimeRouter/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "default/config/FpConfig.fpp"
      - "default/config/FpConstants.fpp"
      - "default/config/ComCfg.fpp"
      - "cmake/platform/unix/Platform/PlatformTypes.fpp"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [fprime-rs, master, devel]
    paths:
      - "Rust/**"
      - "tools/fprime-rs/**"
      # Phases 8 and 9: an upstream edit to a file a generated shim mirrors
      # must re-run its --check, or the Rust-backed copy diverges silently
      - "Fw/Types/**"
      - "Fw/Time/**"
      - "Os/FilePathUtils*"
      - "Os/SandboxedFile.cpp"
      - "Os/Generic/**"
      - "Os/CMakeLists.txt"
      - "cmake/FPrime.cmake"
      - "TestDeploymentsProject/Ref/Top/**"
      - "Utils/Types/**"
      - "Utils/Hash/**"
      - "CFDP/Checksum/**"
      - "Svc/FprimeDeframer/**"
      - "Svc/FprimeFramer/**"
      - "Svc/FprimeProtocol/**"
      - "Svc/FrameAccumulator/**"
      - "Svc/ComQueue/**"
      - "Svc/RustDemo/**"
      - "Svc/FprimeRouter/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "default/config/FpConfig.fpp"
      - "default/config/FpConstants.fpp"
      - "default/config/ComCfg.fpp"
      - "cmake/platform/unix/Platform/PlatformTypes.fpp"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test, build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads Rust/rust-toolchain.toml (cwd-resolved) for the version
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude fprime-ffi --all-targets -- -D warnings
      - name: Clippy (ffi staticlib)
        # --lib, not --all-targets: the shipped target is a no_std staticlib
        # and this is the configuration that actually flies.
        run: cargo clippy -p fprime-ffi --lib -- -D warnings
      - name: Clippy (ffi tests)
        run: cargo clippy -p fprime-ffi --all-targets --features test-std -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude fprime-ffi
      - name: Test (ffi boundary contracts)
        # fprime-ffi needs test-std to build a test harness at all: cargo forces
        # panic="unwind" for the test profile and a no_std crate cannot be built
        # that way. See Rust/fprime-ffi/Cargo.toml.
        run: cargo test -p fprime-ffi --features test-std
      - name: The no_std guard still refuses a release build
        # test-std drops no_std, so it must never reach a flight build. The
        # crate refuses that combination; if the guard ever stopped firing,
        # nothing else would notice.
        run: |
          set +e
          out="$(cargo build --release -p fprime-ffi --features test-std 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "test-std was accepted in a release build; the guard in src/lib.rs is not firing" >&2
            exit 1
          fi
          # A nonzero exit alone proves nothing -- any unrelated build break
          # would produce one and the canary would pass while the guard was
          # gone. Require the guard's own message.
          if ! printf '%s' "$out" | grep -q "must never be enabled in a release build"; then
            echo "the build failed, but not on the no_std guard; the canary proves nothing:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          echo "refused by the guard, as intended"
      - name: Build staticlib (release, panic=abort)
        run: cargo build --release
      - name: Cargo-only binary links no C++
        # Phase 10: the first artifact built from these crates alone. Until it
        # existed the workspace could not produce anything that linked without
        # a C++ object (fprime-ffi's panic handler calls into RustPanicHook.cpp),
        # which made "cargo-only" untestable. Assert it stays that way.
        run: |
          cargo run -p fprime-selftest
          if ldd target/debug/fprime-selftest | grep -Ei "libstdc\+\+|libc\+\+"; then
            echo "::error::the cargo-only binary linked a C++ runtime"
            exit 1
          fi
          echo "no C++ runtime in the link"
      - name: Generated config is up to date
        working-directory: .
        run: |
          python3 tools/fprime-rs/gen_config.py \
            --platform cmake/platform/unix/Platform/PlatformTypes.fpp \
            --config default/config/FpConfig.fpp default/config/ComCfg.fpp \
            --constants default/config/FpConstants.fpp \
            --out /tmp/generated-config.rs \
            --out-cpp /tmp/generated-check.cpp
          diff -u Rust/fprime-config/src/lib.rs /tmp/generated-config.rs
          diff -u Rust/RustConfigCheck.cpp /tmp/generated-check.cpp
      - name: Generated Rust-backed C++ shims match their originals
        # Phases 8 and 9: each of these is a generated near-copy of an
        # upstream file. Catch an upstream edit that never reached one --
        # otherwise the C++ and Rust implementations drift apart silently.
        # Needs no toolchain beyond Python, so it runs in this light job too.
        working-directory: .
        run: |
          python3 tools/fprime-rs/gen_fw_kernel.py --check
          python3 tools/fprime-rs/gen_os_maxheap.py --check
          python3 tools/fprime-rs/gen_os_filepath.py --check
          python3 tools/fprime-rs/gen_fw_time.py --check
          python3 tools/fprime-rs/gen_fw_strings.py --check
      - name: The drift check itself still catches drift
        # Every --check above runs against a pristine tree, so it only ever
        # exercises the pass path. This mutates copies and asserts that real
        # divergences -- a `..` escaping the sandbox root, an inverted heap
        # tie-break, a moved buffer boundary -- are still caught.
        working-directory: .
        run: python3 tools/fprime-rs/test_shimgen.py
  topology-check:
    # Phase 11: the resolved FPP topology must account for every fact in the
    # topology `fpp-to-cpp` generates -- instance count, base IDs, all 357
    # connections, which components start, and the setup/teardown ordering. If
    # it stops accounting for one, the topology is not fully derivable from the
    # model, which is the thing a Rust-native topology would depend on.
    #
    # Cheap by construction: this autocodes the topology only. Nothing is
    # compiled and nothing is linked.
    name: topology is derivable from the model
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fprime tools
        run: |
          python3 -m venv fprime-venv
          . fprime-venv/bin/activate
          pip install -q -r requirements.txt
      - name: The type generator's own tests
        # fpp_to_rust.py is ~2,500 lines that everything downstream of Phase 4
        # rests on. These pin the cases that were actually wrong -- array sizes
        # given as named constants, and types defined inside a component body,
        # which the generator used to drop while reporting success. It lives in
        # this job because it needs fpp-to-json, which only the fprime venv has.
        run: |
          . fprime-venv/bin/activate
          python3 tools/fprime-rs/test_fpp_to_rust.py --require-tools
      - name: Generate the Ref build cache
        working-directory: TestDeploymentsProject
        run: |
          . ../fprime-venv/bin/activate
          fprime-util generate
      - name: Autocode the topology (no compilation)
        run: |
          . fprime-venv/bin/activate
          ninja -C TestDeploymentsProject/build-fprime-automatic-native \
            Ref/Top/RefTopologyAc.cpp
      - name: The model accounts for the generated topology
        run: |
          . fprime-venv/bin/activate
          B=TestDeploymentsProject/build-fprime-automatic-native/Ref/Top
          python3 tools/fprime-rs/fpp_to_rust.py \
            --module-name "TestDeploymentsProject/Ref/Top/topology.fpp" \
            --topology "Ref.Ref" --out /tmp/ref_topology.rs \
            --verify-cpp "$B/RefTopologyAc.cpp" \
            $(tr ';' '\n' < "$B/fpp-import-list") \
            $(tr ';' '\n' < "$B/fpp-source-list")
      - name: The emitted topology is valid Rust
        run: rustc --edition 2021 --crate-type lib --emit=metadata -o /tmp/topo.rmeta /tmp/ref_topology.rs

  framework-check:
    # Builds the C++ framework with the Rust implementations selected and runs
    # the affected unit-test suites (the equivalence oracles): the codec
    # differential UT plus the Fw/Types suite (the oracle for the Phase 8
    # serialization kernel), the Os, Os/Generic and Os/Generic/Types suites
    # (Phase 9's path resolution and max heap, plus the three priority-queue
    # suites that run on top of the heap), CircularBuffer/Queue, CRC32, CFDP checksum,
    # FprimeDeframer/FprimeFramer, FrameAccumulator (incl. detector tests),
    # FprimeRouter and ComQueue suites, plus the RustDemo component whose glue
    # is fully generated -- all against the Rust-backed modules, under
    # ASan/UBSan.
    name: fprime-util check (Rust-backed modules)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned Rust toolchain
        working-directory: Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fprime tools
        run: |
          python3 -m venv fprime-venv
          . fprime-venv/bin/activate
          pip install -q -r requirements.txt
      - name: Generated code is up to date
        run: |
          . fprime-venv/bin/activate
          python3 tools/fprime-rs/gen_config.py \
            --platform cmake/platform/unix/Platform/PlatformTypes.fpp \
            --config default/config/FpConfig.fpp default/config/ComCfg.fpp \
            --constants default/config/FpConstants.fpp \
            --out /tmp/generated-config.rs --out-cpp /tmp/generated-check.cpp
          diff -u Rust/fprime-config/src/lib.rs /tmp/generated-config.rs
          diff -u Rust/RustConfigCheck.cpp /tmp/generated-check.cpp
          python3 tools/fprime-rs/fpp_to_rust.py \
            --module-name "Svc/FprimeProtocol/FprimeProtocol.fpp" \
            --out /tmp/fprime_protocol.rs Svc/FprimeProtocol/FprimeProtocol.fpp
          diff -u Rust/fprime-svc/src/generated/fprime_protocol.rs /tmp/fprime_protocol.rs
          python3 tools/fprime-rs/fpp_to_rust.py \
            --module-name "default/config/ComCfg.fpp" --modules ComCfg \
            --out /tmp/com_cfg.rs \
            cmake/platform/unix/Platform/PlatformTypes.fpp \
            default/config/FpConfig.fpp default/config/FpConstants.fpp \
            default/config/ComCfg.fpp
          diff -u Rust/fprime-svc/src/generated/com_cfg.rs /tmp/com_cfg.rs
          python3 tools/fprime-rs/fpp_to_rust.py \
            --module-name "Svc/RustDemo/RustDemo.fpp" --component RustDemo \
            --out /tmp/rust_demo_glue.rs --out-header /tmp/RustDemoGlue.h \
            --out-shim /tmp/RustDemoShim.cpp \
            --shim-include "Svc/RustDemo/RustDemo.hpp" \
            --glue-include "Rust/RustDemoGlue.h" \
            cmake/platform/unix/Platform/PlatformTypes.fpp \
            default/config/FpConfig.fpp default/config/ComCfg.fpp \
            Fw/Buffer/Buffer.fpp Fw/Log/Log.fpp Fw/Time/Time.fpp \
            Fw/Cmd/Cmd.fpp Fw/Tlm/Tlm.fpp \
            Svc/RustDemo/RustDemoPorts.fpp Svc/RustDemo/RustDemo.fpp
          diff -u Rust/fprime-svc/src/generated/rust_demo_glue.rs /tmp/rust_demo_glue.rs
          diff -u Svc/RustDemo/RustDemoShim.cpp /tmp/RustDemoShim.cpp
          diff -u Rust/RustDemoGlue.h /tmp/RustDemoGlue.h
      - name: Generate UT build cache
        # FPRIME_RUST_AUTOCODE=ON exercises cmake/autocoder/rust.cmake, which
        # re-verifies the checked-in generated Rust against its model at build
        # time; without this the autocoder would be untested and would rot.
        # FPRIME_RUST_IMPL_FW_TYPES defaults OFF (see Rust/enable.cmake), so
        # it must be requested explicitly or the Phase 8 kernel — and the
        # Fw/Types suite that is its oracle — would never be exercised here.
        run: |
          . fprime-venv/bin/activate
          fprime-util generate --ut -DFPRIME_RUST_AUTOCODE=ON -DFPRIME_RUST_IMPL_FW_TYPES=ON
      - name: C++ originals still compile with every switch OFF
        # With a FPRIME_RUST_IMPL_* switch ON, the C++ file it replaces is not
        # in the build at all -- so an upstream change could stop it compiling
        # and nothing would notice until someone flipped the switch back. This
        # builds (not tests) the affected modules in the OFF position, which is
        # the rollback path, so it stays known-good.
        run: |
          . fprime-venv/bin/activate
          CACHE="$PWD/build-rust-off"
          fprime-util generate --ut --build-cache "$CACHE" -DFPRIME_ENABLE_RUST=OFF
          for dir in Fw/Types Fw/Time Os Os/Generic/Types Utils/Types Utils/Hash CFDP/Checksum \
                     Svc/FprimeDeframer Svc/FprimeFramer Svc/FrameAccumulator \
                     Svc/FprimeRouter Svc/ComQueue; do
            (cd "$dir" && fprime-util build --ut --build-cache "$CACHE" -j4)
          done
      - name: Check Rust-backed modules
        run: |
          . fprime-venv/bin/activate
          for dir in Rust Fw/Types Fw/Time Os Os/Generic Os/Generic/Types Utils/Types Utils/Hash CFDP/Checksum Svc/FprimeDeframer Svc/FprimeFramer Svc/FrameAccumulator Svc/FprimeRouter Svc/ComQueue Svc/RustDemo; do
            (cd "$dir" && fprime-util check -j4)
          done
