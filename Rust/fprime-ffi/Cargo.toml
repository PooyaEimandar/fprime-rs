[package]
name = "fprime-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "extern \"C\" surface of the F Prime Rust crates, built as libfprime_rust.a"

[lib]
name = "fprime_rust"
crate-type = ["staticlib", "rlib"]

# `cargo test` cannot build this crate without a feature, and the feature is
# deliberately awkward to ship.
#
# Cargo forces `panic = "unwind"` for the whole test profile -- the harness has
# to catch a failing assertion -- and a `no_std` crate cannot be built that
# way. `cfg(test)` does not help: it is set only on the test harness target,
# not on the lib target that `cargo test` builds alongside it. So the only
# route to testing the ~2000 lines of unsafe pointer work in here is a feature
# that drops `no_std`.
#
# That is a feature which, if it ever reached a flight build, would silently
# change the panic strategy of flight software. It is named for what it is,
# it is not a default, and src/lib.rs refuses to compile with it enabled in a
# release build. Enable it only as `cargo test -p fprime-ffi --features
# test-std`.
[features]
test-std = []

[dependencies]
fprime-config = { path = "../fprime-config" }
fprime-core = { path = "../fprime-core" }
fprime-svc = { path = "../fprime-svc" }
fprime-utils = { path = "../fprime-utils" }

[lints.rust]
# Every function in this crate is an `unsafe extern "C"` boundary whose body is
# the unsafe operation, and each carries a `# Safety` contract in its docs.
# Wrapping each body in a redundant inner `unsafe` block is queued cleanup, not
# a safety gap -- see Rust/SAFETY.md.
unsafe_op_in_unsafe_fn = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
